name: One-time site content maintenance

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-site-content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update address, profile link, and CTA language
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          profile_url = "https://www.psychologytoday.com/us/therapists/brandon-reeves-baton-rouge-la/1177474"
          profile_li = f'<li><a href="{profile_url}" target="_blank" rel="noopener">Psychology Today profile</a></li>'

          for path in Path('.').rglob('*.html'):
              text = path.read_text()
              original = text
              text = text.replace('Suite C', 'Suite D')
              text = text.replace('Book a Session', 'Schedule Free Consultation')
              text = text.replace('Schedule a Session', 'Schedule Free Consultation')
              text = text.replace('Book Online', 'Schedule Free Consultation')
              if path.name == 'about.html' and profile_url not in text:
                  text = text.replace(
                      '<li>EMDR trained</li>\n    <li>I see clients',
                      f'<li>EMDR trained</li>\n    {profile_li}\n    <li>I see clients'
                  )
              if text != original:
                  path.write_text(text)

          workflow = Path('.github/workflows/site-content-maintenance.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update office suite and profile link"
            git push
          fi
